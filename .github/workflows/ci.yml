name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: pdm install
      - run: pdm run ruff check .
      - run: shellcheck -s sh scripts/export-bundle.sh scripts/install-skill.sh
      - run: pdm run pytest -v

  export-script-jq16:
    # export-bundle.sh promises jq 1.6+. Run its parity tests with the oldest supported jq.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"
      - name: Install jq 1.6 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/jq16"
          curl -fsSL -o "$RUNNER_TEMP/jq16/jq" \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          # sha256 from https://raw.githubusercontent.com/jqlang/jq/master/sig/v1.6/sha256sum.txt
          # (linked as "checksums" from https://jqlang.github.io/jq/download/)
          echo "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  $RUNNER_TEMP/jq16/jq" \
            | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq16/jq"
          echo "$RUNNER_TEMP/jq16" >> "$GITHUB_PATH"
      - run: test "$(jq --version)" = jq-1.6
      - run: pdm install
      - run: pdm run pytest -v tests/test_export_script.py

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kba-ci
      - name: Apply demo workloads after the namespace's default service account exists
        run: |
          kubectl --context kind-kba-ci create namespace audit-demo
          for _ in $(seq 1 30); do
            kubectl --context kind-kba-ci -n audit-demo get serviceaccount default >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl --context kind-kba-ci -n audit-demo get serviceaccount default
          kubectl --context kind-kba-ci apply -f examples/kind-demo/insecure.yaml
      - run: kubectl --context kind-kba-ci -n audit-demo wait --for=condition=Ready pod/hardened --timeout=180s
      - run: pdm install
      - run: K8S_BASELINE_AUDIT_IT_CONTEXT=kind-kba-ci pdm run pytest -m integration -v
